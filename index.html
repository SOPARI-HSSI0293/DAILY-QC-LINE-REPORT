<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily QC Line Report - HSSI</title>
<style>
:root{
  --green:#0f7a3d; --green-d:#0a5a2d; --ink:#1c211e; --muted:#5d675f;
  --paper:#eef0ec; --card:#fff; --line:#d3d8d1; --amber:#b7791f; --red:#c0392b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{background:var(--green);color:#fff;padding:12px 16px}
.head-in{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
header h1{margin:0;font-size:19px;letter-spacing:.2px}
header p{margin:2px 0 0;font-size:13px;opacity:.85}
#new{border:1px solid rgba(255,255,255,.6);background:none;color:#fff;font:inherit;font-size:14px;padding:6px 12px;border-radius:7px;cursor:pointer}
#new:hover{background:rgba(255,255,255,.12)}
.wrap{max-width:1400px;margin:0 auto;padding:12px}
.layout{display:grid;grid-template-columns:1fr;gap:12px}
.banner{background:#fff4d6;border:1px solid #e6c667;border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.card>h2{margin:0;padding:10px 14px;font-size:16px;background:#dfe5dc;display:flex;justify-content:space-between;align-items:center}
.badge{font-size:13px;font-weight:600;background:var(--green);color:#fff;border-radius:999px;padding:1px 9px}
.badge.zero{background:#9aa39b}
.body{padding:12px 14px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 3px}
input,select,textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid #b9c0b7;border-radius:7px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:44px;overflow:hidden}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.meta label{margin-top:0}

/* baris temuan */
.row{border:1px solid var(--line);border-left:4px solid var(--green);border-radius:8px;padding:4px 12px 12px;margin-bottom:10px;background:#fafbf9}
.row-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);padding-top:8px}
.fields{display:grid;grid-template-columns:repeat(12,1fr);column-gap:10px}
.f{grid-column:span 12}
.f-line,.f-time{grid-column:span 6}
.f-seg{order:9}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 6px;border:1px solid #b9c0b7;background:#fff;border-radius:7px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on.Open,.seg button.on.Hold{background:var(--amber);border-color:var(--amber);color:#fff}
.seg button.on.Closed,.seg button.on.OK{background:var(--green);border-color:var(--green);color:#fff}
.seg button.on.NG{background:var(--red);border-color:var(--red);color:#fff}
.add{width:100%;padding:10px;border:1.5px dashed var(--green);background:#fff;color:var(--green-d);font:inherit;font-weight:600;border-radius:8px;cursor:pointer}
.add:hover{background:#f1f8f3}
.del{border:0;background:none;color:var(--red);font:inherit;font-size:13px;padding:4px 0;cursor:pointer}
.none{color:var(--muted);font-size:14px;margin:0 0 10px}
.carry{background:#fff4d6;border-color:#e6c667}
.carry .item{padding:8px 0;border-top:1px solid #ecd9a0;font-size:14px}
.carry .item:first-of-type{border-top:0}
.carry button{margin-top:6px;padding:6px 12px;border:1px solid var(--amber);background:#fff;color:var(--amber);border-radius:7px;font:inherit;font-weight:600;cursor:pointer}

/* tombol aksi */
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;z-index:5}
.bar button{flex:1;max-width:240px;padding:12px;border-radius:9px;border:0;font:inherit;font-weight:700;cursor:pointer}
#save{background:var(--green);color:#fff}
#wag{background:#25d366;color:#08331a}
.bar button:disabled{opacity:.55}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:14px;max-width:90%;display:none;text-align:center;z-index:9}
.toast.err{background:var(--red)}

/* daftar laporan terbaru */
.recent{margin-top:12px;margin-bottom:0}
.recent summary{cursor:pointer;list-style:none;padding:10px 14px;font-weight:600;font-size:16px;background:#dfe5dc;display:flex;justify-content:space-between;align-items:center}
.recent summary::-webkit-details-marker{display:none}
.rlist{max-height:46vh;overflow-y:auto;padding:6px}
.rlist .none{padding:6px 8px;margin:0}
.ritem{display:block;width:100%;text-align:left;border:1px solid transparent;background:#fff;border-radius:7px;padding:8px 10px;font:inherit;cursor:pointer;color:var(--ink)}
.ritem+.ritem{margin-top:2px}
.ritem:hover{background:#f1f8f3;border-color:var(--line)}
.ritem b{display:block;font-size:14px}
.ritem span{display:block;font-size:13px;color:var(--muted)}
.ritem.cur{background:#e3f1e7;border-color:var(--green)}

/* layar lebar (PC / laptop) */
@media (min-width:700px){
  .f{grid-column:span var(--w,12)}
  .f-seg{order:0}
}
@media (min-width:1000px){
  body{padding-bottom:24px}
  .layout{grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
  aside{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto}
  .rlist{max-height:calc(100vh - 420px);min-height:160px}
  .meta{grid-template-columns:1fr}
  .meta label{margin-top:10px}
  .meta>div:first-child label{margin-top:0}
  .bar{position:static;flex-direction:column;border:1px solid var(--line);border-radius:10px;padding:12px}
  .bar button{max-width:none;width:100%;flex:none}
  .toast{bottom:24px}
}
@media (min-width:1500px){
  .wrap,.head-in{max-width:1600px}
  .layout{grid-template-columns:320px minmax(0,1fr)}
}
</style>
</head>
<body>
<header>
  <div class="head-in">
    <div><h1>Daily QC Line Report</h1><p>HSSI</p></div>
    <button id="new" type="button">Laporan baru</button>
  </div>
</header>
<div class="wrap">
  <div id="banner"></div>
  <div class="layout">
    <aside>
      <div id="meta"></div>
      <div id="carry"></div>
      <div class="bar">
        <button id="save" type="button">Simpan</button>
        <button id="wag" type="button">Kirim ke WAG</button>
      </div>
      <div id="recent"></div>
    </aside>
    <div id="sections"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// 1) Tempel URL Web App Apps Script di sini (hasil Deploy).
const API_URL = 'https://script.google.com/macros/s/AKfycbwsP-VS2e52Y1L6I_HGl9K0lwCBKmYzK7zMsULS8AIsqH7Zgjh5GMk-N6MOGuF-b6Tq/exec';

const DEFAULT_LISTS = { line: ['Line 1','Line 2','Line 3'], qc: [], qcs: [], shift: ['Shift 1','Shift 2','Shift 3'] };
let lists = { ...DEFAULT_LISTS };
let openItems = [];
let recent = [];

// ReportID: R-<tanggal>-<no shift>-<kode QC>, contoh R-20261012-1-ATF
function shiftNo(s) {
  const m = (s || '').match(/\d+/);
  return m ? m[0] : String(Math.max(0, lists.shift.indexOf(s)) + 1);
}
function kodeQC(nama) {
  const f = (lists.qcs || []).find(q => q.nama === nama);
  if (f && f.kode) return f.kode.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  return (nama || '').replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase();
}
function makeId(d) {
  return 'R-' + d.tanggal.replace(/-/g, '') + '-' + shiftNo(d.shift) + '-' + kodeQC(d.qc);
}

const now = () => { const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };

// w = lebar kolom (dari 12) pada layar lebar
const SECTIONS = {
  abnormal: { title: '1. Abnormal Proses', add: 'Tambah abnormal',
    fields: [
      { k:'line', l:'Line', t:'line', w:3 }, { k:'jam', l:'Jam', t:'time', w:2 },
      { k:'status', l:'Status', t:'seg', o:['Open','Closed'], w:4 },
      { k:'problem', l:'Problem detail', t:'area', w:4 }, { k:'rootcause', l:'Root cause', t:'area', w:4 },
      { k:'action', l:'Corrective action', t:'area', w:4 } ],
    empty: () => ({ line:'', jam:now(), problem:'', rootcause:'', action:'', status:'Open', parentId:'' }) },
  judgment: { title: '2. Judgment Proses', add: 'Tambah judgment',
    fields: [
      { k:'line', l:'Line', t:'line', w:3 }, { k:'jam', l:'Jam', t:'time', w:2 },
      { k:'hasilj', l:'Hasil judgment', t:'seg', o:['OK','NG','Hold'], w:4 },
      { k:'jenis', l:'Jenis masalah', t:'area', w:4 },
      { k:'judg', l:'Judgment', t:'area', w:4 }, { k:'dasar', l:'Dasar judgment', t:'area', w:4 },
      { k:'ket', l:'Keterangan', t:'area', w:12 } ],
    empty: () => ({ line:'', jam:now(), jenis:'', judg:'', dasar:'', hasilj:'OK', ket:'' }) },
  delivery: { title: '3. Delivery', add: 'Tambah temuan delivery',
    fields: [
      { k:'line', l:'Line', t:'line', w:3 }, { k:'jam', l:'Jam', t:'time', w:2 },
      { k:'status', l:'Status', t:'seg', o:['OK','NG'], w:4 },
      { k:'temuan', l:'Temuan masalah', t:'area', w:6 }, { k:'tindakan', l:'Tindakan langsung', t:'area', w:6 } ],
    empty: () => ({ line:'', jam:now(), temuan:'', tindakan:'', status:'OK' }) },
  control: { title: '4. Control New Size / Trial / Lain-lain', add: 'Tambah catatan',
    fields: [ { k:'ket', l:'Keterangan', t:'area', w:12 } ],
    empty: () => ({ ket:'' }) }
};

let S = load();

function blank() {
  return { reportId:'', tanggal: today(), shift: localStorage.getItem('qc_shift') || '', qc: localStorage.getItem('qc_name') || '',
           abnormal:[], judgment:[], delivery:[], control:[] };
}
function load() {
  try { const d = JSON.parse(localStorage.getItem('qc_draft')); if (d && d.tanggal) return d; } catch(e) {}
  return blank();
}
function persist() {
  localStorage.setItem('qc_draft', JSON.stringify(S));
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const opts = (arr, sel, ph) => '<option value="">' + ph + '</option>' + arr.map(v => `<option${v===sel?' selected':''}>${esc(v)}</option>`).join('');

function fieldHTML(sec, i, f, row) {
  const id = `${sec}-${i}-${f.k}`;
  const wrap = inner => `<div class="f f-${f.t}" style="--w:${f.w || 12}">${inner}</div>`;
  if (f.t === 'seg')
    return wrap(`<label>${f.l}</label><div class="seg">${f.o.map(o => `<button type="button" class="${o}${row[f.k]===o?' on':''}" data-seg="${sec}|${i}|${f.k}|${o}">${o}</button>`).join('')}</div>`);
  if (f.t === 'line')
    return wrap(`<label for="${id}">${f.l}</label><select id="${id}" data-f="${sec}|${i}|${f.k}">${opts(lists.line, row[f.k], 'Pilih')}</select>`);
  if (f.t === 'time')
    return wrap(`<label for="${id}">${f.l} (24 jam)</label><input id="${id}" type="text" inputmode="numeric" maxlength="5" placeholder="08:30" autocomplete="off" value="${esc(row[f.k])}" data-f="${sec}|${i}|${f.k}" data-time="1">`);
  return wrap(`<label for="${id}">${f.l}</label><textarea id="${id}" rows="2" data-f="${sec}|${i}|${f.k}">${esc(row[f.k])}</textarea>`);
}

function grow(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 2 + 'px'; }

function render() {
  document.getElementById('meta').innerHTML = `
  <div class="card"><div class="body"><div class="meta">
    <div><label for="tgl">Tanggal</label><input id="tgl" type="date" value="${esc(S.tanggal)}"></div>
    <div><label for="shf">Shift</label><select id="shf">${opts(lists.shift, S.shift, 'Pilih')}</select></div>
    <div><label for="qc">Nama QC</label>${lists.qc.length
      ? `<select id="qc">${opts(lists.qc, S.qc, 'Pilih')}</select>`
      : `<input id="qc" value="${esc(S.qc)}" placeholder="Nama">`}</div>
  </div></div></div>`;

  let c = '';
  const cid = (S.tanggal && S.shift && S.qc) ? makeId(S) : '';
  const shown = openItems.filter(o => !(cid && o.itemId.startsWith(cid + '-A')) && !S.abnormal.some(r => r.parentId === o.itemId));
  if (shown.length) c += `<div class="card carry"><h2>Abnormal masih Open <span class="badge">${shown.length}</span></h2><div class="body">` +
    shown.map(o => `<div class="item"><b>${esc(o.line)}</b> · ${esc(o.tanggal)} ${esc(o.shift)} ${esc(o.jam)}<br>${esc(o.problem)}<br><button type="button" data-carry="${esc(o.itemId)}">Lanjutkan di laporan ini</button></div>`).join('') +
    `</div></div>`;
  document.getElementById('carry').innerHTML = c;

  let h = '';
  for (const [sec, def] of Object.entries(SECTIONS)) {
    const rows = S[sec];
    h += `<div class="card"><h2>${def.title}<span class="badge${rows.length?'':' zero'}">${rows.length}</span></h2><div class="body">`;
    if (!rows.length) h += `<p class="none">Tidak ada temuan.</p>`;
    rows.forEach((row, i) => {
      h += `<div class="row"><div class="row-head"><span>#${i+1}${row.parentId ? ' · lanjutan' : ''}</span><button class="del" type="button" data-del="${sec}|${i}">Hapus</button></div>`;
      h += `<div class="fields">${def.fields.map(f => fieldHTML(sec, i, f, row)).join('')}</div></div>`;
    });
    h += `<button class="add" type="button" data-add="${sec}">+ ${def.add}</button></div></div>`;
  }
  const box = document.getElementById('sections');
  box.innerHTML = h;
  box.querySelectorAll('textarea').forEach(grow);
}

const TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
function normTime(v) {
  v = (v || '').trim();
  const m = v.match(/^(\d{1,2})[:.]?(\d{2})$/);
  return m ? m[1].padStart(2, '0') + ':' + m[2] : v;
}

document.addEventListener('focusout', e => {
  const t = e.target;
  if (!t.dataset || !t.dataset.time) return;
  const v = normTime(t.value);
  t.value = v;
  const [sec, i, k] = t.dataset.f.split('|');
  S[sec][+i][k] = v;
  persist();
  if (v && !TIME_RE.test(v)) toast('Format jam 24 jam, contoh 08:30 atau 14:05.', true);
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.time) {
    let v = t.value.replace(/[^\d:]/g, '');
    if (/^\d{2}$/.test(v) && e.inputType !== 'deleteContentBackward') v += ':';
    t.value = v;
  }
  if (t.tagName === 'TEXTAREA') grow(t);
  if (t.id === 'tgl') S.tanggal = t.value;
  else if (t.id === 'shf') { S.shift = t.value; localStorage.setItem('qc_shift', t.value); }
  else if (t.id === 'qc') { S.qc = t.value; localStorage.setItem('qc_name', t.value); }
  else if (t.dataset.f) { const [sec,i,k] = t.dataset.f.split('|'); S[sec][+i][k] = t.value; }
  persist();
});

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.add) { S[b.dataset.add].push(SECTIONS[b.dataset.add].empty()); persist(); render(); }
  else if (b.dataset.del) { const [sec,i] = b.dataset.del.split('|'); S[sec].splice(+i,1); persist(); render(); }
  else if (b.dataset.seg) { const [sec,i,k,v] = b.dataset.seg.split('|'); S[sec][+i][k] = v; persist(); render(); }
  else if (b.dataset.load) loadReport(b.dataset.load);
  else if (b.dataset.carry) {
    const o = openItems.find(x => x.itemId === b.dataset.carry);
    S.abnormal.push({ line:o.line, jam:now(), problem:o.problem, rootcause:o.rootcause, action:o.action, status:'Open', parentId:o.itemId });
    persist(); render();
  }
});

function renderRecent() {
  const el = document.getElementById('recent');
  if (!API_URL) { el.innerHTML = ''; return; }
  const was = el.querySelector('details');
  const open = was ? was.open : window.matchMedia('(min-width:1000px)').matches;
  el.innerHTML = `<details class="card recent"${open ? ' open' : ''}><summary>Laporan terbaru <span class="badge${recent.length ? '' : ' zero'}">${recent.length}</span></summary><div class="rlist">` +
    (recent.length
      ? recent.map(r => `<button type="button" class="ritem${r.id === S.reportId ? ' cur' : ''}" data-load="${esc(r.id)}"><b>${esc(r.id)}</b><span>${esc(r.tanggal)} · ${esc(r.shift)} · ${esc(r.qc)}</span></button>`).join('')
      : '<p class="none">Belum ada laporan.</p>') +
    `</div></details>`;
}

async function refreshRecent() {
  if (!API_URL) return;
  try {
    const j = await (await fetch(API_URL + '?action=recent')).json();
    if (j.ok) { recent = j.list; renderRecent(); }
  } catch (e) {}
}

async function loadReport(id) {
  const c = cleaned();
  const hasContent = ['abnormal','judgment','delivery','control'].some(sec => c[sec].length);
  if (id !== S.reportId && hasContent && !confirm('Tampilkan laporan ' + id + '? Isian di layar yang belum disimpan akan diganti.')) return;
  try {
    const j = await (await fetch(API_URL + '?action=report&id=' + encodeURIComponent(id))).json();
    if (!j.ok) throw new Error(j.error);
    const d = j.data;
    S = { reportId: id, tanggal: d.tanggal, shift: d.shift, qc: d.qc,
          abnormal: d.abnormal, judgment: d.judgment, delivery: d.delivery, control: d.control };
    persist(); render(); renderRecent();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    toast('Laporan ' + id + ' ditampilkan. Ubah, Simpan, lalu Kirim ke WAG.');
  } catch (e) { toast('Gagal memuat laporan: ' + e.message, true); }
}

window.addEventListener('resize', () => document.querySelectorAll('#sections textarea').forEach(grow));

function toast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 3600);
}

function cleaned() {
  const out = { ...S };
  for (const [sec, def] of Object.entries(SECTIONS)) {
    const textKeys = def.fields.filter(f => f.t === 'area').map(f => f.k);
    out[sec] = S[sec].filter(r => textKeys.some(k => (r[k] || '').trim()));
  }
  return out;
}

function validate(d) {
  if (!d.tanggal || !d.shift || !(d.qc || '').trim()) return 'Lengkapi Tanggal, Shift, dan Nama QC.';
  for (const sec of ['abnormal','judgment','delivery']) {
    if (d[sec].some(r => !r.line)) return `Pilih Line pada ${SECTIONS[sec].title}.`;
    if (d[sec].some(r => !TIME_RE.test(normTime(r.jam)))) return `Jam pada ${SECTIONS[sec].title} harus format 24 jam, contoh 08:30.`;
  }
  return '';
}

function report(d) {
  const L = [];
  L.push('*DAILY QC LINE REPORT*');
  L.push(`Tanggal : ${d.tanggal}`, `Shift : ${d.shift}`, `Nama QC : ${d.qc}`, '');
  const block = (sec, fn) => {
    L.push(`*${SECTIONS[sec].title}*`);
    if (!d[sec].length) L.push('- Tidak ada');
    d[sec].forEach((r, i) => L.push(...fn(r, i + 1)));
    L.push('');
  };
  block('abnormal', (r, n) => [`${n}. ${r.line} | ${r.jam}`, `Problem: ${r.problem || '-'}`, `Root cause: ${r.rootcause || '-'}`, `Corrective action: ${r.action || '-'}`, `Status: ${r.status}`]);
  block('judgment', (r, n) => [`${n}. ${r.line} | ${r.jam}`, `Jenis masalah: ${r.jenis || '-'}`, `Judgment: ${r.judg || '-'}`, `Dasar: ${r.dasar || '-'}`, `Hasil: ${r.hasilj || '-'}`, `Ket: ${r.ket || '-'}`]);
  block('delivery', (r, n) => [`${n}. ${r.line} | ${r.jam}`, `Temuan: ${r.temuan || '-'}`, `Tindakan: ${r.tindakan || '-'}`, `Status: ${r.status}`]);
  block('control', (r, n) => [`${n}. ${r.ket}`]);
  return L.join('\n').trim();
}

async function save() {
  const d = cleaned(); const err = validate(d);
  if (err) { toast(err, true); return false; }
  if (!API_URL) { toast('Belum terhubung ke Google Sheets (API_URL kosong).', true); return false; }
  d.reportId = makeId(d);
  const btn = document.getElementById('save'); btn.disabled = true; btn.textContent = 'Menyimpan...';
  try {
    const res = await fetch(API_URL, { method:'POST', body: JSON.stringify(d) });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error);
    S.reportId = j.reportId; persist(); toast('Tersimpan: ' + j.reportId);
    refreshRecent();
    return true;
  } catch (e) { toast('Gagal menyimpan: ' + e.message, true); return false; }
  finally { btn.disabled = false; btn.textContent = 'Simpan'; }
}

document.getElementById('save').onclick = save;

document.getElementById('wag').onclick = async () => {
  const d = cleaned(); const err = validate(d);
  if (err) return toast(err, true);
  const text = report(d);
  const win = window.open('', '_blank');          // dibuka dulu agar tidak diblokir browser
  if (API_URL && !(await save())) { if (win) win.close(); return; }
  try { await navigator.clipboard.writeText(text); } catch (e) {}
  const url = 'https://web.whatsapp.com/send?text=' + encodeURIComponent(text);
  if (win) win.location = url; else window.location = url;
  toast('WhatsApp Web dibuka. Bila kolom pesan kosong, tempel dengan Ctrl+V.');
};

document.getElementById('new').onclick = () => {
  if (!confirm('Mulai laporan baru? Isian saat ini akan dihapus dari layar (data yang sudah disimpan tetap aman di Sheets).')) return;
  S = blank(); persist(); render(); renderRecent();
};

async function init() {
  if (!API_URL) {
    document.getElementById('banner').innerHTML = '<div class="banner">Mode uji: belum terhubung ke Google Sheets. Tombol Kirim ke WAG tetap bisa dicoba.</div>';
  } else {
    try {
      const j = await (await fetch(API_URL)).json();
      if (j.ok) {
        const qcs = j.qcs || [];
        lists = { line: j.line.length ? j.line : DEFAULT_LISTS.line, qcs, qc: qcs.map(q => q.nama), shift: j.shift.length ? j.shift : DEFAULT_LISTS.shift };
        openItems = j.open || [];
        recent = j.recent || [];
      }
    } catch (e) { toast('Daftar Line gagal dimuat, memakai bawaan.', true); }
  }
  render();
  renderRecent();
}
init();
</script>
